name: Release

# Every commit on main ships. The version is the base in ./VERSION plus the run
# number, so it moves forward without anyone remembering to bump anything.
on:
  push:
    branches: [main]
    # Documentation does not need a build. Everything else does.
    paths-ignore:
      - "**/*.md"
      - "LICENSE"
      - ".github/release-notes-footer.md"
  # …which means a docs-only push leaves the latest release behind the branch,
  # and a history rewrite leaves none at all. This is the way back.
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # Whether to release is decided from the commit *subject* only.
  #
  # This started as a job-level `if: !contains(head_commit.message, ...)` and
  # the very first commit skipped itself — its body explained the escape hatch
  # and so contained the magic words. A flag you can trip by writing about it
  # is not a flag, so the check now reads the first line and nothing else.
  guard:
    name: Should we release?
    runs-on: ubuntu-latest
    outputs:
      release: ${{ steps.check.outputs.release }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - id: check
        run: |
          SUBJECT=$(git log -1 --pretty=%s)
          echo "subject: $SUBJECT"
          # A manual run is a deliberate act and is never talked out of it.
          if [[ "${{ github.event_name }}" != "workflow_dispatch" \
                && "$SUBJECT" == *"[skip release]"* ]]; then
            echo "release=false" >> "$GITHUB_OUTPUT"
            echo "skipping: the subject line asks us to"
          else
            echo "release=true" >> "$GITHUB_OUTPUT"
          fi

  release:
    name: Build & publish
    needs: guard
    if: needs.guard.outputs.release == 'true'
    runs-on: macos-15
    # Mapped up here so the steps below can ask whether they exist. A fork has
    # none of them, and must still get a working build out of the same file —
    # so every signing step is conditional and the artefacts stay ad-hoc signed
    # rather than the run going red.
    env:
      MACOS_CERTIFICATE_P12: ${{ secrets.MACOS_CERTIFICATE_P12 }}
      MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
      MACOS_SIGNING_IDENTITY: ${{ secrets.MACOS_SIGNING_IDENTITY }}
      AC_API_KEY_ID: ${{ secrets.AC_API_KEY_ID }}
      AC_API_ISSUER_ID: ${{ secrets.AC_API_ISSUER_ID }}
      AC_API_KEY_P8: ${{ secrets.AC_API_KEY_P8 }}
    steps:
      - uses: actions/checkout@v4

      - name: Work out the version
        run: |
          BASE=$(cat VERSION)
          echo "VERSION=$BASE.${{ github.run_number }}" >> "$GITHUB_ENV"
          echo "COMMIT=${GITHUB_SHA::7}" >> "$GITHUB_ENV"

      - name: Test
        run: swift test

      - name: Import the signing certificate
        if: env.MACOS_CERTIFICATE_P12 != ''
        run: |
          # A keychain of its own, in the runner's temp directory: it is thrown
          # away with the machine, and nothing here touches the login keychain.
          KEYCHAIN="$RUNNER_TEMP/signing.keychain-db"
          PASSWORD="$(uuidgen)"
          security create-keychain -p "$PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$PASSWORD" "$KEYCHAIN"

          echo "$MACOS_CERTIFICATE_P12" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" -k "$KEYCHAIN" \
            -P "$MACOS_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          rm -f "$RUNNER_TEMP/cert.p12"

          # Without this, codesign blocks on a UI prompt no one can answer.
          security set-key-partition-list -S apple-tool:,apple:,codesign: \
            -s -k "$PASSWORD" "$KEYCHAIN" >/dev/null
          security list-keychain -d user -s "$KEYCHAIN" login.keychain-db

          echo "CODESIGN_IDENTITY=$MACOS_SIGNING_IDENTITY" >> "$GITHUB_ENV"
          echo "SIGNING_KEYCHAIN=$KEYCHAIN" >> "$GITHUB_ENV"

      - name: Write the notarisation key
        if: env.AC_API_KEY_P8 != ''
        run: |
          KEY="$RUNNER_TEMP/notary.p8"
          echo "$AC_API_KEY_P8" | base64 --decode > "$KEY"
          chmod 600 "$KEY"
          echo "AC_API_KEY_PATH=$KEY" >> "$GITHUB_ENV"

      - name: Build app bundle
        run: VERSION="$VERSION" COMMIT="$COMMIT" ./scripts/make_app.sh

      # Gated on the certificate, not on the Apple keys: notarisation needs a
      # Developer ID signature, and submitting an ad-hoc build fails the run
      # rather than warning. A repository with the keys but no certificate is a
      # half-finished setup, and it should still ship.
      - name: Notarise the app
        if: env.MACOS_CERTIFICATE_P12 != ''
        run: ./scripts/notarize.sh build/Corral.app

      # Built from the stapled app, so the copy inside carries its own ticket.
      - name: Build DMG
        run: VERSION="$VERSION" ./scripts/make_dmg.sh

      - name: Notarise the DMG
        if: env.MACOS_CERTIFICATE_P12 != ''
        run: ./scripts/notarize.sh "build/Corral-$VERSION.dmg"

      - name: Also ship a zip
        run: |
          cd build
          ditto -c -k --sequesterRsrc --keepParent Corral.app "Corral-$VERSION.zip"

      - name: Checksums
        run: |
          cd build
          shasum -a 256 "Corral-$VERSION.dmg" > "Corral-$VERSION.dmg.sha256"
          shasum -a 256 "Corral-$VERSION.zip" > "Corral-$VERSION.zip.sha256"

      - name: Verify the build carries this commit
        run: |
          build/Corral.app/Contents/MacOS/Corral --version
          build/Corral.app/Contents/MacOS/Corral --version | grep -q "$COMMIT"

      - name: Compose release notes
        run: |
          {
            echo "**Version:** \`$VERSION\` · **Build commit:** [\`$COMMIT\`]($GITHUB_SERVER_URL/$GITHUB_REPOSITORY/commit/$GITHUB_SHA)"
            echo ""
            echo "| Download | SHA-256 |"
            echo "|---|---|"
            echo "| \`Corral-$VERSION.dmg\` | \`$(cut -d' ' -f1 "build/Corral-$VERSION.dmg.sha256")\` |"
            echo "| \`Corral-$VERSION.zip\` | \`$(cut -d' ' -f1 "build/Corral-$VERSION.zip.sha256")\` |"
            echo ""
            echo "### Installing"
            echo ""
            echo "Open the DMG and drag **Corral** to Applications."
            echo ""
            # What the person downloading this will actually meet, decided by
            # looking rather than by assuming. A release built without the
            # signing secrets is ad-hoc, and telling its readers to double-click
            # would send them into a warning with no explanation.
            if xcrun stapler validate "build/Corral-$VERSION.dmg" >/dev/null 2>&1; then
              echo "Signed and notarised by Apple, so it opens on a double click."
              echo "Universal: Apple Silicon and Intel."
            else
              echo "This build is signed ad hoc rather than notarised, so the first"
              echo "launch needs **right-click → Open** (or **System Settings →"
              echo "Privacy & Security → Open Anyway**)."
            fi
            echo ""
            echo "Verify what you downloaded against the checksum above, and"
            echo "\`Corral --version\` prints the commit it was built from."
            echo ""
            cat .github/release-notes-footer.md
          } > /tmp/release-notes.md

      - name: Forget the credentials
        if: always()
        run: |
          rm -f "$RUNNER_TEMP/notary.p8" "$RUNNER_TEMP/cert.p12"
          [ -n "${SIGNING_KEYCHAIN:-}" ] && security delete-keychain "$SIGNING_KEYCHAIN" || true

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v$VERSION" \
            "build/Corral-$VERSION.dmg" \
            "build/Corral-$VERSION.dmg.sha256" \
            "build/Corral-$VERSION.zip" \
            "build/Corral-$VERSION.zip.sha256" \
            --title "Corral $VERSION" \
            --generate-notes \
            --notes-file /tmp/release-notes.md
