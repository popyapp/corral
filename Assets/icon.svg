<svg width="1024" height="1024" viewBox="0 0 1024 1024" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- macOS app icon: Big Sur-style rounded rect inset in a 1024 canvas with
       transparent margins. Regenerate the .icns with scripts/make_icon.sh.

       The mark is a pen seen from above, open at one side: a gate, not a
       letterform. It happens to read as a C, which is no bad thing. Inside,
       one agent still awake and two gone quiet — the two dim dots drop out
       below ~32px, which is fine: the enclosure is the mark. -->
  <defs>
    <linearGradient id="g" x1="100" y1="100" x2="924" y2="924" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#f0a878"/><stop offset="52%" stop-color="#d97757"/><stop offset="100%" stop-color="#a8452f"/>
    </linearGradient>
  </defs>
  <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#g)"/>
  <!-- Pen seen from above. The gap is narrow and on the right: a gate, not a
       letterform. -->
  <path d="M690 296 H404 a108 108 0 0 0 -108 108 v216 a108 108 0 0 0 108 108 h286"
        fill="none" stroke="#fff" stroke-width="82" stroke-linecap="round"/>
  <path d="M690 296 a108 108 0 0 1 38 30" fill="none" stroke="#fff" stroke-width="82" stroke-linecap="round"/>
  <path d="M690 728 a108 108 0 0 0 38 -30" fill="none" stroke="#fff" stroke-width="82" stroke-linecap="round"/>
  <!-- one awake, two asleep -->
  <circle cx="470" cy="512" r="56" fill="#fff"/>
  <circle cx="622" cy="424" r="36" fill="#8a3520" fill-opacity="0.5"/>
  <circle cx="622" cy="600" r="36" fill="#8a3520" fill-opacity="0.5"/>
</svg>
