<svg width="1024" height="1024" viewBox="0 0 1024 1024" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- macOS app icon: Big Sur-style rounded rect inset in a 1024 canvas with
       transparent margins. Regenerate the .icns with scripts/make_icon.sh.

       A gauge. Earlier drafts tried to draw a corral — a fence, a pen, a lasso —
       and every one of them read as something else at icon size: a hashtag, a
       magnifying glass, a gear, a face. The name carries the metaphor; the icon
       carries the job. The needle rests low on purpose: the agents are idle,
       which is the state this app was built to show you. -->
  <defs>
    <linearGradient id="bg" x1="100" y1="100" x2="924" y2="924" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#f2b183"/>
      <stop offset="55%" stop-color="#d97757"/>
      <stop offset="100%" stop-color="#9e3f2b"/>
    </linearGradient>
    <linearGradient id="sheen" x1="512" y1="100" x2="512" y2="560" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#fff" stop-opacity="0.14"/>
      <stop offset="100%" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <filter id="sh" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="14" stdDeviation="22" flood-color="#000000" flood-opacity="0.3"/>
    </filter>
  </defs>

  <rect x="100" y="100" width="824" height="824" rx="180" fill="url(#bg)" filter="url(#sh)"/>
  <rect x="100" y="100" width="824" height="824" rx="180" fill="url(#sheen)"/>

  <!-- dial face -->
  <circle cx="512" cy="540" r="190" fill="rgba(255,255,255,0.17)"/>

  <!-- graduations, outside the arc -->
  <g stroke="rgba(255,255,255,0.75)" stroke-linecap="round" stroke-width="17">
    <path d="M296 452 l-46 -22"/>
    <path d="M364 344 l-30 -42"/>
    <path d="M512 296 v-48"/>
    <path d="M660 344 l30 -42"/>
    <path d="M728 452 l46 -22"/>
  </g>

  <!-- the scale -->
  <path d="M326 636 A208 208 0 1 1 698 636" stroke="#fff" stroke-width="46"
        stroke-linecap="round" fill="none"/>

  <!-- needle, resting low-left: quiet -->
  <path d="M508 578 L386 470" stroke="#fff" stroke-width="38" stroke-linecap="round"/>
  <circle cx="512" cy="584" r="48" fill="#fff"/>
  <circle cx="512" cy="584" r="18" fill="#bf5c3c"/>
</svg>
